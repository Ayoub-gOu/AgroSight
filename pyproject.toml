[project]
name = "inference-uav"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ayoubGO", email = "ayoub.gouhassoun@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "segmentation-models-pytorch>=0.6.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
inference-uav = "inference_uav:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
